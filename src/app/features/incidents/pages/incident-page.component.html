<div class="d-flex">
  <h2 class="mb-4">Incidents page</h2>
  <button type="button" class="btn btn-primary btn-lg ms-auto align-self-start">
    New incident
  </button>
</div>

<div class="row mb-5 mt-3">
  <div class="col-sm-8">
    <input
      class="form-control"
      type="search"
      placeholder="Incident name or description..."
      aria-label="Search"
    />
  </div>
  <div class="col-sm-2">
    <button class="btn btn-outline-success w-100" type="submit">Search</button>
  </div>
  <div class="col-sm-2">
    <button class="btn btn-outline-success w-100" type="submit">Filters</button>
  </div>
</div>

<div class="row mb-4">
  @for (incident of incidents(); track incident.id) {
  <div class="col-sm-4 mb-3">
    <incident-card-component [incident]="incident" (onClick)="onClick($event)" />
  </div>
  }@empty {
  <div class="col-12 text-center py-5">
    <p class="text-muted">There are no incidents</p>
  </div>
  }
</div>

<ng-template #sureModal let-sureModal>
  <div class="modal-header">
    <h4 class="modal-title">Eliminar incidente</h4>
  </div>
  <div class="modal-body">
    <p>
      Estas a punto de eliminar la incidencia
      <strong>{{ selectedIncident()?.id }} - {{ selectedIncident()?.title }}</strong
      >. Esta acción no tiene reversión, ¿estas seguro de proceder?
    </p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-danger" (click)="closeModal(sureModal)">Delete</button>
    <button type="button" class="btn btn-secondary" (click)="closeModal(sureModal)">Cancel</button>
  </div>
</ng-template>
