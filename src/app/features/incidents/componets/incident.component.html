<div class="d-flex">
  <h2 class="mb-4">Incidents</h2>
  <button type="button" class="btn btn-primary btn-lg ms-auto align-self-start">
    New incident
  </button>
</div>

<div class="row mb-5 mt-3">
  <div class="col-sm-8">
    <input
      class="form-control"
      type="search"
      placeholder="Incident name or description..."
      aria-label="Search"
    />
  </div>
  <div class="col-sm-2">
    <button class="btn btn-outline-success w-100" type="submit">Search</button>
  </div>
  <div class="col-sm-2">
    <button class="btn btn-outline-success w-100" type="submit">Filters</button>
  </div>
</div>

<div class="row mb-4">
  @for (incident of incidents(); track incident.id) {
  <div class="col-sm-4 mb-3">
    <div class="card h-100">
      <div class="card-body d-flex flex-column flex-grow-1">
        <span class="text-muted small fst-italic mb-2"
          >Last update: {{ incident.updateAt | incidentDate }}</span
        >
        <h5 class="card-title">
          {{ incident.title }}
        </h5>
        <h6>
          <span class="badge badge-{{ getAlertTypeByPriority(incident.priority) }} mb-2">{{
            incident.priority
          }}</span>
        </h6>

        <p class="card-text">
          {{ incident.description }}
        </p>
        <div class="d-flex mt-auto align-items-end">
          <button type="button" class="btn btn-primary btn-sm align-self-start">Details</button>
          <span class="badge badge-light ms-auto">{{ incident.status }}</span>
        </div>
      </div>
    </div>
  </div>
  }@empty {
  <div class="col-12 text-center py-5">
    <p class="text-muted">There are no incidents</p>
  </div>
  }
</div>
